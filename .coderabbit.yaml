language: en-GB
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  path_filters:
    - "!vendor/**"
    - "!**/*.min.js"
    - "!bin/**"
    - "!obj/**"
  path_instructions:
    - path: "**/*.cs"
      instructions: >-
        Prioritise correctness, threading, asynchronous lifecycle, cancellation,
        uncertain message delivery, bounded retries, security and resource
        disposal. Flag regressions with concrete reproduction scenarios.
        Preserve intentional browser origin and session isolation boundaries.
    - path: "**/*.js"
      instructions: >-
        Focus on event ordering, streamed updates, memory leaks, UI state
        consistency and safe rendering of untrusted content. Avoid low-value
        style-only comments.
    - path: "tests/**"
      instructions: >-
        Check that tests detect meaningful regressions, use deterministic
        fixtures and avoid real user identifiers or external requests.
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
