name: Build and tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build headless host
        run: dotnet build src/Neko.Headless/Neko.Headless.csproj --configuration Release
      - name: Build transport
        run: dotnet build src/Neko.Transport/Neko.Transport.csproj --configuration Release
      - name: Run transport tests
        run: dotnet test tests/Neko.Transport.Tests/Neko.Transport.Tests.csproj --configuration Release
      - name: Run core tests
        run: dotnet test tests/Neko.Core.Tests/Neko.Core.Tests.csproj --configuration Release
      - name: Run headless tests
        run: dotnet test tests/Neko.Headless.Tests/Neko.Headless.Tests.csproj --configuration Release
      - name: Audit public source
        run: node scripts/check-public-source.cjs
