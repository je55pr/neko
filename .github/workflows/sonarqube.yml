name: SonarQube Cloud

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ vars.SONAR_CI_ANALYSIS == 'true' && vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' }}
    runs-on: windows-latest
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Analyse .NET project
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if (-not $env:SONAR_TOKEN) { throw 'SONAR_TOKEN is not configured.' }
          dotnet tool install --global dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet sonarscanner begin "/k:$env:SONAR_PROJECT_KEY" "/o:$env:SONAR_ORGANIZATION" "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Neko.Headless/Neko.Headless.csproj --configuration Release --no-incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
